[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redveil"
version = "0.1.0"
description = "Detect faces and cover them with a red privacy grid."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "yeonsik" }]
dependencies = [
  "fastapi>=0.111",
  "numpy>=1.23",
  "opencv-python>=4.8",
  "pillow>=10.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.29"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5"
]

[project.scripts]
redveil = "redveil.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
